<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alex Chai | Graphic Designer</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --primary: #0EA5E9; --primary-soft: #E0F2FE; --accent: #38BDF8;
            --surface: #ffffff; --text-main: #0f172a; --text-muted: #64748b;
            --border: rgba(14, 165, 233, 0.15); --font-family: 'Plus Jakarta Sans', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: var(--font-family); background-color: #f0f9ff; color: var(--text-main); min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }

        .ambient-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.4) 0px, transparent 50%), radial-gradient(at 100% 0%, rgba(14, 165, 233, 0.2) 0px, transparent 50%), radial-gradient(at 100% 100%, rgba(186, 230, 253, 0.8) 0px, transparent 50%), radial-gradient(at 0% 100%, rgba(224, 242, 254, 0.8) 0px, transparent 50%); filter: blur(40px); animation: breathe 10s ease-in-out infinite alternate; }
        @keyframes breathe { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }

        .scene { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; perspective: 1200px; }
        .card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid white; box-shadow: 0 20px 50px -12px rgba(14, 165, 233, 0.25); width: 400px; border-radius: 32px; position: relative; transform-style: preserve-3d; transition: transform 0.1s linear; display: flex; flex-direction: column; z-index: 1; }

        .header-bg { height: 140px; width: 100%; background: linear-gradient(135deg, #0EA5E9, #38BDF8); border-radius: 32px 32px 0 0; position: relative; overflow: hidden; }
        .avatar-wrapper { width: 120px; height: 120px; margin: -60px auto 0; position: relative; z-index: 10; }
        .avatar-ring { width: 100%; height: 100%; border-radius: 50%; padding: 4px; background: white; box-shadow: 0 10px 25px rgba(14, 165, 233, 0.3); }
        .profile-pic { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #f1f5f9; display: block; }
        .online-badge { position: absolute; bottom: 6px; right: 6px; width: 20px; height: 20px; background: #10B981; border: 3px solid white; border-radius: 50%; }

        .content { padding: 20px 24px 32px; text-align: center; }
        h1 { font-size: 32px; font-weight: 800; background: linear-gradient(180deg, #0f172a, #334155); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
        .role-tag { display: inline-block; background: var(--primary-soft); color: var(--primary); padding: 6px 12px; border-radius: 100px; font-size: 13px; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; }
        .org { font-size: 15px; color: var(--text-muted); margin-bottom: 24px; font-weight: 500; }

        .grid-links { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
        .link-card { background: white; border: 1px solid var(--border); border-radius: 20px; padding: 16px; text-decoration: none; color: var(--text-main); transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; position: relative; overflow: hidden; }
        .link-card:hover { border-color: var(--primary); transform: translateY(-4px); box-shadow: 0 15px 30px -5px rgba(14, 165, 233, 0.15); }
        .link-label { font-size: 14px; font-weight: 600; }
        .link-email, .link-phone, .link-whatsapp, .link-linkedin { grid-column: span 2; }

        .save-btn { width: 100%; background: linear-gradient(135deg, #0EA5E9, #2563EB); color: white; border: none; padding: 20px; border-radius: 24px; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px; box-shadow: 0 10px 25px -5px rgba(14, 165, 233, 0.5); font-family: inherit; }
        .spinner { display: none; width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media screen and (max-width: 768px) {
            .scene { align-items: flex-start; }
            .card { width: 100%; min-height: 100vh; border-radius: 0; transform: none !important; }
            .header-bg { height: 180px; border-radius: 0 0 32px 32px; }
        }
    </style>
</head>
<body>

    <div class="ambient-bg"></div>

    <div class="scene" id="scene">
        <div class="card" id="card">
            <div class="header-bg"></div>
            <div class="avatar-wrapper">
                <div class="avatar-ring">
                    <!-- Image link is visible here -->
                    <img id="p-img" class="profile-pic" alt="Profile" src="https://firebasestorage.googleapis.com/v0/b/blinkapp-684c1.appspot.com/o/user%2F5mVs2lacXdVn1u4jRtI9Fbvuma62%2Fcard%2FKx7gOr6WPMrwmUQ6vYXK%2Fprofile-picture%2Fa3fef5d2-867d-4307-a353-1e2ca5ffb652?alt=media&token=9b09b930-fa0a-4455-986e-2b701f3568b5"> 
                </div>
                <div class="online-badge"></div>
            </div>
            
            <div class="content">
                <span class="role-tag" id="p-role"></span>
                <h1 id="p-name"></h1>
                <div class="org" id="p-org"></div>

                <div class="grid-links">
                    <a id="l-em" class="link-card link-email"><i data-lucide="mail"></i><span class="link-label">Email</span></a>
                    <a id="l-ph" class="link-card link-phone"><i data-lucide="phone"></i><span class="link-label">Call</span></a>
                    <a id="l-wa" target="_blank" class="link-card link-whatsapp"><i data-lucide="message-circle"></i><span class="link-label">WhatsApp</span></a>
                    <a id="l-li" target="_blank" class="link-card link-linkedin"><i data-lucide="linkedin"></i><span class="link-label">LinkedIn</span></a>
                </div>

                <button class="save-btn" id="save-btn">
                    <i data-lucide="download-cloud"></i>
                    <span>Save Contact</span>
                    <div class="spinner" id="spinner"></div>
                </button>
            </div>
        </div>
    </div>

    <script>
        // OBFUSCATED TEXT DATA (Base64)
        const _v = {
            n: "QWxleCBDaGFp", // Alex Chai
            r: "R3JhcGhpYyBEZXNpZ25lcg==", // Graphic Designer
            o: "VGh1bmRlcm1hdGNoIFRlY2hub2xvZ3k=", // Thundermatch Technology
            p: "MDEyMzM3NTE4Ng==", // 0123375186
            e: "YWxleGNoYWlAeGNhbGV4LmNvbQ==", // alexchai@xcalex.com
            w: "aHR0cHM6Ly94Y2FsZXguY29t", // https://xcalex.com
            l: "aHR0cHM6Ly93d3cubGlua2VkaW4uY29tL2luL2FsZXhjaGFpNjkxMw==" // linkedin
        };

        const dec = (s) => atob(s);

        // Inject text and links into page
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('p-name').innerText = dec(_v.n);
            document.getElementById('p-role').innerText = dec(_v.r);
            document.getElementById('p-org').innerText = dec(_v.o);
            
            document.getElementById('l-em').href = "mailto:" + dec(_v.e);
            document.getElementById('l-ph').href = "tel:" + dec(_v.p);
            document.getElementById('l-wa').href = "https://api.whatsapp.com/send?phone=6" + dec(_v.p);
            document.getElementById('l-li').href = dec(_v.l);

            lucide.createIcons();
        });

        // Generate VCard
        async function generateVCard() {
            const btn = document.getElementById('save-btn');
            const spinner = document.getElementById('spinner');
            const icon = btn.querySelector('svg');
            const label = btn.querySelector('span');

            icon.style.display = 'none';
            spinner.style.display = 'block';
            label.innerText = "Downloading...";

            let v = `BEGIN:VCARD\nVERSION:3.0\n`;
            v += `FN:${dec(_v.n)}\nORG:${dec(_v.o)}\nTITLE:${dec(_v.r)}\n`;
            v += `TEL;TYPE=CELL:${dec(_v.p)}\nEMAIL:${dec(_v.e)}\nURL:${dec(_v.w)}\n`;
            v += `END:VCARD`;

            const blob = new Blob([v], { type: "text/vcard;charset=utf-8" });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = "Alex_Chai.vcf";
            link.click();

            setTimeout(() => {
                icon.style.display = 'block';
                spinner.style.display = 'none';
                label.innerText = "Save Contact";
            }, 1000);
        }

        document.getElementById('save-btn').addEventListener('click', generateVCard);

        // Desktop Tilt Effect
        if (window.matchMedia("(min-width: 769px)").matches) {
            document.addEventListener('mousemove', (e) => {
                const x = (window.innerWidth / 2 - e.pageX) / 25;
                const y = (window.innerHeight / 2 - e.pageY) / 25;
                document.getElementById('card').style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
            });
        }
    </script>
</body>
</html>
